apis:
- name: Provivi Content GraphQL API
  description: >-
    The KeystoneJS 5 headless-CMS GraphQL backend that serves the provivi.com marketing site. It exposes
    199 types, 83 query fields and 122 mutation fields covering the site's content model — Article,
    PressRelease, Product, Page, Farmer, Investor, TeamMember, Faq, HeroBlock, Multimedia, Vimeo, Lang and
    related lists. Anonymous introspection and anonymous read queries both succeed over HTTPS. Provivi
    publishes no documentation, no reference, no terms of use and no support channel for this endpoint;
    it is captured here as an observed public surface, not as a developer product.
  humanURL: https://www.provivi.com/en
