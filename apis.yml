aid: provivi
name: Provivi
description: >-
  Provivi, Inc. is an agricultural biotechnology company headquartered at 1701 Colorado Avenue, Santa
  Monica, California, founded in 2013 by Pedro Coelho, Peter Meinhold and Nobel laureate Frances Arnold.
  Provivi manufactures insect sex pheromones using a patented catalytic olefin-metathesis process that
  cuts production cost far enough to make mating-disruption pest control economic on high-acreage row
  crops — corn, rice and soy — rather than only on high-value specialty crops. Its commercial products
  target fall armyworm (Spodoptera frugiperda) and are distributed through regional partners including
  UPL in Mexico, Koppert in Brazil, AgNova in Australia, Andermatt in East Africa and Susbin in
  Argentina. Provivi is not a software vendor: it runs no developer program, publishes no API
  documentation, terms of use or pricing for machine access, and ships no SDKs. The only machine-readable
  surface it operates is the undocumented KeystoneJS GraphQL backend that serves content to provivi.com.
